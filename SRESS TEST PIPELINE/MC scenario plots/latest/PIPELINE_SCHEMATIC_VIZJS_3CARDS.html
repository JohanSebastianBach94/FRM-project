<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { margin: 0; padding: 0; background: white; }
    #wrap { padding: 24px 28px; }
  </style>
</head>
<body>
  <div id="wrap"></div>

  <script src="https://unpkg.com/viz.js@2.1.2/viz.js"></script>
  <script src="https://unpkg.com/viz.js@2.1.2/full.render.js"></script>
  <script>
    (async () => {
      const dot = "digraph pipeline {\n  rankdir=LR;\n  bgcolor=\"white\";\n  labelloc=\"t\";\n  label=\"Stress-testing via Monte Carlo scenarios\";\n  fontsize=24;\n  fontname=\"Helvetica\";\n  pad=0.25;\n  nodesep=0.55;\n  ranksep=0.8;\n\n  edge [color=\"#444444\", penwidth=2.0, arrowsize=0.95];\n  node [shape=box, style=\"rounded\", color=\"#444444\", fontname=\"Helvetica\"]; \n\n  model  [label=<\n    <TABLE BORDER=\"1\" CELLBORDER=\"0\" CELLSPACING=\"0\" CELLPADDING=\"10\" COLOR=\"#444444\">\n      <TR>\n        <TD ALIGN=\"CENTER\" BGCOLOR=\"#FFFFFF\">\n          <FONT POINT-SIZE=\"14\"><B>Model and framework</B></FONT>\n        </TD>\n      </TR>\n      <TR>\n        <TD BGCOLOR=\"#FFFFFF\" HEIGHT=\"6\"></TD>\n      </TR>\n\n      <TR>\n        <TD BGCOLOR=\"#EBF5FF\" ALIGN=\"LEFT\">\n          <FONT POINT-SIZE=\"12\"><B>Inputs &amp; prep (Step 1)</B></FONT><BR/>\n          <FONT POINT-SIZE=\"10\">Macro/market series -&gt; cleaning, standardization, health checks</FONT>\n        </TD>\n      </TR>\n      <TR>\n        <TD BGCOLOR=\"#ECF8EF\" ALIGN=\"LEFT\">\n          <FONT POINT-SIZE=\"12\"><B>Country blocks (Step 2)</B></FONT><BR/>\n          <FONT POINT-SIZE=\"10\">Group factors into themes (banking, FX, public finance, commodities, ...)</FONT>\n        </TD>\n      </TR>\n      <TR>\n        <TD BGCOLOR=\"#ECF8EF\" ALIGN=\"LEFT\">\n          <FONT POINT-SIZE=\"12\"><B>Factor dynamics (Step 3)</B></FONT><BR/>\n          <FONT POINT-SIZE=\"10\">Volatility + correlations (ADCC / DCC-GARCH family) + mean reversion</FONT>\n        </TD>\n      </TR>\n    </TABLE>\n  >];\n  mc     [label=<\n    <TABLE BORDER=\"1\" CELLBORDER=\"0\" CELLSPACING=\"0\" CELLPADDING=\"10\" COLOR=\"#444444\">\n      <TR>\n        <TD ALIGN=\"CENTER\" BGCOLOR=\"#FFFFFF\">\n          <FONT POINT-SIZE=\"14\"><B>MC scenario building</B></FONT>\n        </TD>\n      </TR>\n      <TR>\n        <TD BGCOLOR=\"#FFFFFF\" HEIGHT=\"6\"></TD>\n      </TR>\n\n      <TR>\n        <TD BGCOLOR=\"#FFF3E6\" ALIGN=\"LEFT\">\n          <FONT POINT-SIZE=\"12\"><B>Monte Carlo scenarios (Step 4)</B></FONT><BR/>\n          <FONT POINT-SIZE=\"10\">Simulate many joint futures for block shock paths</FONT>\n        </TD>\n      </TR>\n      <TR>\n        <TD BGCOLOR=\"#FFF3E6\" ALIGN=\"LEFT\">\n          <FONT POINT-SIZE=\"12\"><B>Regimes (Step 5)</B></FONT><BR/>\n          <FONT POINT-SIZE=\"10\">Bucket draws by severity quantiles (baseline -&gt; adverse -&gt; crisis)</FONT>\n        </TD>\n      </TR>\n    </TABLE>\n  >];\n  report [label=<\n    <TABLE BORDER=\"1\" CELLBORDER=\"0\" CELLSPACING=\"0\" CELLPADDING=\"10\" COLOR=\"#444444\">\n      <TR>\n        <TD ALIGN=\"CENTER\" BGCOLOR=\"#FFFFFF\">\n          <FONT POINT-SIZE=\"14\"><B>Reporting and Ranking</B></FONT>\n        </TD>\n      </TR>\n      <TR>\n        <TD BGCOLOR=\"#FFFFFF\" HEIGHT=\"6\"></TD>\n      </TR>\n\n      <TR>\n        <TD BGCOLOR=\"#EBF5FF\" ALIGN=\"LEFT\">\n          <FONT POINT-SIZE=\"12\"><B>Realized overlay</B></FONT><BR/>\n          <FONT POINT-SIZE=\"10\">Compute &quot;Today&quot; from the latest window (comparable sigma units)</FONT>\n        </TD>\n      </TR>\n      <TR>\n        <TD BGCOLOR=\"#F7EEF7\" ALIGN=\"LEFT\">\n          <FONT POINT-SIZE=\"12\"><B>Reporting</B></FONT><BR/>\n          <FONT POINT-SIZE=\"10\">Severity distributions + ranking; crisis drivers (block shares)</FONT>\n        </TD>\n      </TR>\n      <TR>\n        <TD BGCOLOR=\"#F7EEF7\" ALIGN=\"LEFT\">\n          <FONT POINT-SIZE=\"12\"><B>Network lens</B></FONT><BR/>\n          <FONT POINT-SIZE=\"10\">Connectedness deltas (stress regime vs median)</FONT>\n        </TD>\n      </TR>\n    </TABLE>\n  >];\n\n  model -> mc -> report;\n}\n";
      const wrap = document.getElementById('wrap');
      try {
        const viz = new Viz();
        const svg = await viz.renderSVGElement(dot);
        svg.setAttribute('data-rendered', '1');
        wrap.appendChild(svg);
      } catch (e) {
        wrap.innerText = 'viz.js render failed: ' + (e && e.message ? e.message : String(e));
      }
    })();
  </script>
</body>
</html>
