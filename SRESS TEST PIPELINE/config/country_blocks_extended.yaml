notes:
  - GC.DOD.TOTL.GD.ZS_* series now live only inside public_finance blocks for each country; macro blocks host CPI/GDP/credit stocks only.
  - MOVE/TED sources are centralized inside the `financial_markets` block so the same instrument no longer appears in banking_system or systemic_stress blocks.
  - France/Italy/Spain CDS and spread proxies are derived in `scripts/derive_public_finance_proxies.py` and stored under data_repository/raw/providers/derived_risk_drivers to keep public_finance coverage consistent with macro literature (debt and spreads together).
  - Extra commodity proxies (WTI_Crude_Futures, TTF_GAS, LME_METALS_INDEX) land in the `commodities` block so the macro/public_finance split focuses on fundamentals and fiscal metrics.
  - Next recommended step: run the scripts that depend on this file (presence check, `analysis/collect_block_status.py`, and `analysis/missing_series_report.py`) to verify the blocks after the reconstruction and flag any additional missing series.
