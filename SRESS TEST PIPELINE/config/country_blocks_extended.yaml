#+#+#+#+############################################################
# Country blocks (governed driver allow-list)
#
# Notes:
# - Series ordering in `series_codes` matters: Step 2 harmonization keeps the first-K
#   drivers per block (weakest-ISO cutoff).
# - Downstream factor prep should prefer `outputs/country_block_definition.json`.
#+#+#+#+############################################################

country_blocks:

# --- USA (USA) ---
- country: USA
  iso_code: USA
  region: USA
  coverage_window: 1990-2025
  blocks:

  - key: macro
    coverage: Core GDP (GDPC1), CPI, unemployment, nominal GDP, BIS credit stocks cover 1990–2025 (monthly/quarterly as noted).
    status_notes: Ingested series anchored on FRED/Eurostat/WB feeds ensure continuous macro coverage.
    series_codes:
    - GDPC1
    - NAEXKP01USQ661S
    - CPIAUCSL
    - UNRATE
    - BIS_LBS_Private_NFC_USA
    - M1SL
    - M2SL
    - DFF
    local_series_files:
      NOMINAL_GDP_USA: data_repository/raw/macro/NOMINAL_GDP_USA.csv
      M2SL: data_repository/raw/fred/M2SL.csv
      M1SL: data_repository/raw/fred/M1SL.csv
    data_provenance:
      M2SL: FRED M2SL (money supply aggregate)
      M1SL: FRED M1SL (narrow money aggregate)
  - key: real_estate
    coverage: HPI real, 30-year mortgage rate, mortgage debt BIS, rent-to-income and price-to-income ratios cover 1990–2025 where available.
    status_notes: Use FRED MORTGAGE30US as the US benchmark mortgage time series; keep affordability ratios for context.
    series_codes:
    - USA_HPI_REAL
    - Rent_to_income_ratio_USA
    - Price_to_income_USA
    - BIS_LBS_Household_Loans_USA
    local_series_files:
      USA_HPI_REAL: data_repository/raw/fred/CSUSHPISA.csv
      MORTGAGE30US: data_repository/raw/fred/MORTGAGE30US.csv
      Rent_to_income_ratio_USA: data_repository/raw/providers/derived_risk_drivers/Rent_to_income_ratio_USA.csv
      Price_to_income_USA: data_repository/raw/providers/derived_risk_drivers/Price_to_income_ratio_USA.csv
      BIS_LBS_Household_Loans_USA: data_repository/raw/providers/bis_lbs/monthly/BIS_LBS_Household_Loans_USA.csv
    data_provenance:
      USA_HPI_REAL: FRED CSUSHPISA (S&P/Case-Shiller U.S. National Home Price Index)
      MORTGAGE30US: FRED MORTGAGE30US (stress indicator pipeline)
      Rent_to_income_ratio_USA: scripts/derive_real_estate_ratios.py (Eurostat/FRED rent and income ratios)
      Price_to_income_USA: scripts/derive_real_estate_ratios.py (Eurostat/FRED rent and income ratios)
      BIS_LBS_Household_Loans_USA: scripts/ingest_zero_data_series.py (BIS household loans monthly resampled)
    missing_series:
      Rent_to_income_ratio_USA: proxy_established
      Price_to_income_ratio_USA: proxy_established
  - key: public_finance
    coverage: DNSS betas + debt-to-GDP + sovereign spreads and CDS where available.
    status_notes: Use DNSS betas for curve shape; sovereign yield curve proxies (IRLTLT01*) are redundant when the DNSS factors are healthy.
    series_codes:
    - USA_beta0
    - USA_beta1
    - USA_beta2
    - USA_beta3
    - GC.DOD.TOTL.GD.ZS_USA
    - Sovereign_spread_vs_Germany_USA
    - CDS_5y_USA
    local_series_files:
      GC.DOD.TOTL.GD.ZS_USA: data_repository/raw/macro/general_government_gross_debt_pct_gdp_USA.csv
      Sovereign_spread_vs_Germany_USA: data_repository/raw/providers/derived_risk_drivers/spread_USA_vs_DEU_10Y.csv
      CDS_5y_USA: data_repository/raw/providers/derived_risk_drivers/cds_proxy_USA_vs_DEU_5Y.csv
    data_provenance:
      GC.DOD.TOTL.GD.ZS_USA: worldbank_gov_debt_pct_gdp_parsed
      Sovereign_spread_vs_Germany_USA: scripts/prototype_missing_risk_drivers.py (USA vs Germany 10Y spread derived from Bund and Treasury yields)
      CDS_5y_USA: scripts/prototype_missing_risk_drivers.py (ZCB strip-based 5Y bond spread proxy vs DEU)
      USA_beta3: Derived (DNSS) dnss_pipeline (twist factor calibration)
    missing_series:
      Sovereign_spread_vs_Germany_USA: proxy_established
  - key: external_fx
    coverage: FX indices and cross rates (weekly preferred) 1990–2025.
    status_notes: Add USD indices and key crosses for contagion analysis.
    series_codes:
    - EUR_USD
    - EUR_GBP
    - EUR_CHF
    - EUR_JPY
    - EUR_GBP_XR
    - EUR_CHF_XR
    - EUR_JPY_XR
    - EUR_CNY_XR
    local_series_files:
      DXY: data_repository/raw/fred/DTWEXBGS.csv
      USD_BROAD_INDEX: data_repository/raw/fred/DTWEXBGS.csv
      USD_JPY: data_repository/raw/fred/JPINTDUSDJPY.csv
      GBP_USD: data_repository/raw/fred/CCUSSP01GBM650N.csv
      USD_CNY: data_repository/raw/fred/CCUSSP02CNM650N.csv
      EUR_USD: data_repository/raw/market_data/FX_EURUSD_EURUSD_X.csv
      DEXJPUS: data_repository/raw/fred/DEXJPUS.csv
      DEXSZUS: data_repository/raw/fred/DEXSZUS.csv
      DEXCHUS: data_repository/raw/fred/DEXCHUS.csv
      DEXKOUS: data_repository/raw/fred/DEXKOUS.csv
      DEXMXUS: data_repository/raw/fred/DEXMXUS.csv
      DEXBZUS: data_repository/raw/fred/DEXBZUS.csv
      EMLC: data_repository/raw/market_data/ETF_EMLC.csv
  - key: financial_markets
    coverage: Equity indexes, volatility and credit spreads 1990–2025.
    status_notes: Use VIX for USA; include MOVE, TED and credit spread proxies.
    series_codes:
    - ^GSPC
    - VIXCLS
    - credit_spread_USA
    local_series_files:
      MOVE: data_repository/raw/providers/derived_risk_drivers/move_index_daily.csv
      credit_spread_USA: data_repository/raw/providers/derived_risk_drivers/credit_spread_USA.csv
    data_provenance:
      MOVE: scripts/prototype_missing_risk_drivers.py (yfinance ^MOVE / daily realized-vol proxy)
      XLC: Yahoo Finance yfinance_sector sector_equities
      XLF: Yahoo Finance yfinance_sector sector_equities
      XLK: Yahoo Finance yfinance_sector sector_equities
      XLP: Yahoo Finance yfinance_sector sector_equities
      XLRE: Yahoo Finance yfinance_sector sector_equities
      XLU: Yahoo Finance yfinance_sector sector_equities
      XLV: Yahoo Finance yfinance_sector sector_equities
      XLY: Yahoo Finance yfinance_sector sector_equities
  - key: banking_system
    coverage: BIS LBS aggregates, NPL ratios, bank equity indexes, interbank rates.
    status_notes: Add NPL ratios (annual, safe interpolation), BKX for USA banks, and TEDRATE as interbank stress reference (SOFR_3m coverage < threshold).
    series_codes:
    - BIS_LBS_Household_Loans_USA
    - Bank_equity_index_USA
    - TEDRATE
    local_series_files:
      BIS_LBS_Household_Loans_USA: data_repository/raw/providers/bis_lbs/monthly/BIS_LBS_Household_Loans_USA.csv
      BIS_LBS_Private_NFC_USA: data_repository/processed/BIS_LBS_Private_NFC_Loans_USA.csv
      Bank_equity_index_USA: data_repository/raw/providers/bank_indices/bank_equity_index_USA.csv
      NPL_PROXY_USA: data_repository/raw/providers/npl_proxies/monthly/npl_proxy_USA.csv
      SOFR_3m: data_repository/raw/providers/derived_risk_drivers/SOFR_3m.csv
      TEDRATE: data_repository/raw/providers/derived_risk_drivers/ted_rate_monthly.csv
    data_provenance:
      BIS_LBS_Private_NFC_USA: scripts/ingest_zero_data_series.py (processed BIS private NFC loans flows resampled to month-end)
      Bank_equity_index_USA: Yahoo Finance ^BKX (scripts/fetch_bank_equity_indexes.py)
      NPL_PROXY_USA: BIS LBS household aggregates via scripts/build_npl_proxy_from_bis.py
      SOFR_3m: Merged real-time SOFR from FED note-term SOFR + historical 3m SOFR (scripts/merge_sofr_from_term_note.py)
  - key: systemic_stress
    coverage: MOVE, swaption vol proxies, TED spread, commercial paper spreads.
    series_codes:
    - Treasury_Bund_Spread
    - SWAPTION_VOL_USA
    - TEDRATE
    - COMM_PAPER_SPREAD_USA
    local_series_files:
      TEDRATE: data_repository/raw/providers/derived_risk_drivers/ted_rate_monthly.csv
      TED_SPREAD: data_repository/raw/providers/derived_risk_drivers/ted_rate_monthly.csv
      SWAPTION_VOL_USA: data_repository/raw/providers/derived_risk_drivers/swaption_vol_proxy_USA.csv
      COMM_PAPER_SPREAD_USA: data_repository/raw/providers/derived_risk_drivers/comm_paper_spread_USA.csv
      Treasury_Bund_Spread: data/stress_indicators_expanded.csv
    data_provenance:
      SWAPTION_VOL_USA: scripts/prototype_missing_risk_drivers.py (MOVE-based swaption proxy)
      COMM_PAPER_SPREAD_USA: scripts/derive_public_finance_proxies.py (BAMLH0A0HYM2 vs DGS3)
      Treasury_Bund_Spread: data/stress_indicators_expanded panel merged data (BIS derived spread vs Bund)
      DFF: FRED DFF (effective federal funds rate)
      DSWP10: Panel Derived panel merged_swap_rates (10Y swap volatility)
      WALCL: FRED WALCL (Fed total assets)
    missing_series:
      SWAPTION_VOL_USA: proxy_established
      COMM_PAPER_SPREAD_USA: proxy_established
  - key: commodities
    coverage: Global oil, gas, metals, agricultural, and gold prices plus US sector ETF proxies (Materials/Energy/Industrials) from industry_data_raw.csv.
    series_codes:
    - DCOILBRENTEU
    - DCOILWTICO
    - DHHNGSP
    - FAO_AG_INDEX
    - GOLD_SPOT
    - Gold_Futures
    - WTI_Crude_Futures
    - LME_METALS_INDEX
    - PALUMUSDM
    - PCOPPUSDM
    - PIORECRUSDM
    - PMAIZMTUSDM
    - PSOYBUSDQ
    - PWHEAMTUSDM
    - TTF_GAS
    local_series_files:
      DCOILBRENTEU: data_repository/raw/fred/DCOILBRENTEU.csv
      DCOILWTICO: data_repository/raw/fred/DCOILWTICO.csv
      DHHNGSP: data_repository/raw/fred/DHHNGSP.csv
      FAO_AG_INDEX: data_repository/raw/commodities/FAO_AG_INDEX.csv
      GOLD_SPOT: data_repository/raw/commodities/GOLD_SPOT.csv
      Gold_Futures: data/stress_indicators_expanded.csv
      WTI_Crude_Futures: data/stress_indicators_expanded.csv
      LME_METALS_INDEX: data_repository/raw/commodities/LME_METALS_INDEX.csv
      PALUMUSDM: data_repository/raw/fred/PALUMUSDM.csv
      PCOPPUSDM: data_repository/raw/fred/PCOPPUSDM.csv
      PIORECRUSDM: data_repository/raw/fred/PIORECRUSDM.csv
      PMAIZMTUSDM: data_repository/raw/fred/PMAIZMTUSDM.csv
      PSOYBUSDQ: data_repository/raw/fred/PSOYBUSDQ.csv
      PWHEAMTUSDM: data_repository/raw/fred/PWHEAMTUSDM.csv
      XLB: industry_data_raw.csv
      XLE: industry_data_raw.csv
      XLI: industry_data_raw.csv
    data_provenance:
      DCOILBRENTEU: FRED DCOILBRENTEU (Brent crude spot)
      DCOILWTICO: FRED DCOILWTICO (WTI crude spot)
      DHHNGSP: FRED DHHNGSP (Henry Hub gas spot)
      FAO_AG_INDEX: FAO agriculture price index (manual ingest)
      GOLD_SPOT: Manual resample of Gold_Futures column from data/risk_indicators/pipeline/stress_indicators.csv
      Gold_Futures: Panel merged stress indicators (gold futures volatility signal)
      WTI_Crude_Futures: Panel merged stress indicators (WTI futures volatility signal)
      LME_METALS_INDEX: Manual CSV from LME metal price index
      PALUMUSDM: FRED PALUMUSDM (aluminum index)
      PCOPPUSDM: FRED PCOPPUSDM (copper index)
      PIORECRUSDM: FRED PIORECRUSDM (iron ore index)
      PMAIZMTUSDM: FRED PMAIZMTUSDM (maize index)
      PSOYBUSDQ: FRED PSOYBUSDQ (soybeans index)
      PWHEAMTUSDM: FRED PWHEAMTUSDM (wheat index)

# --- Germany (DEU) ---
- country: Germany
  iso_code: DEU
  region: EUR
  coverage_window: 1990-2025
  blocks:

  - key: macro
    coverage: Core GDP, CPI, unemployment, nominal GDP, BIS credit stocks cover 1990–2025 plus ECB money-supply aggregates (M3/M2/M1).
    series_codes:
    - DEU_GDP_EUROSTAT
    - DEU_UNRATE_EUROSTAT
    - NAEXKP01DEQ661S
    - DEUCPIALLMINMEI
    - BIS_LBS_Private_NFC_DEU
    - MYAGM1EZM196N
    - MYAGM2EZM196N
    - ECBDFR
    - MABMM301EZM189S
    local_series_files:
      BIS_LBS_Private_NFC_DEU: data_repository/raw/providers/bis_lbs/monthly/BIS_LBS_Private_NFC_Total_DEU.csv
      MABMM301EZM189S: data_repository/raw/fred/MABMM301EZM189S.csv
      MYAGM2EZM196N: data_repository/raw/fred/MYAGM2EZM196N.csv
      MYAGM1EZM196N: data_repository/raw/fred/MYAGM1EZM196N.csv
