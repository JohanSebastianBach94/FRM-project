      BIS_LBS_Private_NFC_DEU: data_repository/raw/providers/bis_lbs/monthly/BIS_LBS_Private_NFC_Total_DEU.csv (BIS monthly credit release)
      MABMM301EZM189S: FRED MABMM301EZM189S (Euro area M3 aggregate)
      MYAGM2EZM196N: FRED MYAGM2EZM196N (Euro area M2 aggregate via IMF IFS)
      MYAGM1EZM196N: FRED MYAGM1EZM196N (Euro area M1 aggregate via IMF IFS)
  - key: real_estate
    coverage: HPI real, rent-to-income, price-to-income.
    series_codes:
    - DEU_HPI_REAL
    - Rent_to_income_ratio_DEU
    - Price_to_income_DEU
    - BIS_LBS_Household_Loans_DEU
    local_series_files:
      Rent_to_income_ratio_DEU: data_repository/raw/providers/derived_risk_drivers/Rent_to_income_ratio_DEU.csv
      Price_to_income_DEU: data_repository/raw/providers/derived_risk_drivers/Price_to_income_ratio_DEU.csv
      DEU_HPI_REAL: data_repository/raw/providers/real_estate/DEU_HPI_REAL.csv
      BIS_LBS_Household_Loans_DEU: data_repository/raw/providers/bis_lbs/monthly/BIS_LBS_Household_Loans_DEU.csv
    data_provenance:
      Rent_to_income_ratio_DEU: scripts/derive_real_estate_ratios.py (Eurostat rent & income series)
      Price_to_income_DEU: scripts/derive_real_estate_ratios.py (Eurostat rent & income series)
      DEU_HPI_REAL: scripts/ingest_zero_data_series.py (Eurostat real HPI)
      BIS_LBS_Household_Loans_DEU: scripts/ingest_zero_data_series.py (BIS household loans monthly resampled)
    missing_series:
      Rent_to_income_ratio_DEU: proxy_established
      Price_to_income_DEU: proxy_established
  - key: public_finance
    coverage: DNSS betas + debt-to-GDP; DEU anchors the euro-area curve.
    series_codes:
    - DEU_beta0
    - DEU_beta1
    - DEU_beta2
    - DEU_beta3
    - GC.DOD.TOTL.GD.ZS_DEU
    - Treasury_Bund_Spread
    - CDS_5y_DEU
    local_series_files:
      CDS_5y_DEU: data_repository/raw/providers/derived_risk_drivers/cds_proxy_DEU_vs_USA_5Y.csv
    data_provenance:
      CDS_5y_DEU: scripts/prototype_missing_risk_drivers.py (Benchmark CDS proxy vs USA 5Y)
      DEU_beta3: Derived (DNSS) dnss_pipeline (twist factor calibration)
  - key: external_fx
    coverage: EUR bilateral FX vs key non-euro currencies (USD, GBP, CHF, JPY, CNY).
    series_codes:
    - EUR_USD
    - EUR_GBP
    - EUR_CHF
    - EUR_JPY
    - EUR_GBP_XR
    - EUR_CHF_XR
    - EUR_JPY_XR
    - EUR_CNY_XR
    local_series_files:
      EUR_USD: data_repository/raw/market_data/FX_EURUSD_EURUSD_X.csv
      EUR_TRY_XR: data_repository/raw/market_data/FX_EURTRY_EURTRY_X.csv
      EUR_PLN_XR: data_repository/raw/market_data/FX_EURPLN_EURPLN_X.csv
      EUR_CZK_XR: data_repository/raw/market_data/FX_EURCZK_EURCZK_X.csv
      DEXJPUS: data_repository/raw/fred/DEXJPUS.csv
      DEXSZUS: data_repository/raw/fred/DEXSZUS.csv
      DEXCHUS: data_repository/raw/fred/DEXCHUS.csv
      EMLC: data_repository/raw/market_data/ETF_EMLC.csv
  - key: financial_markets
    coverage: Equity indexes, credit spreads.
    series_codes:
    - ^GDAXI
    - VIXCLS
    - credit_spread_DEU
    local_series_files:
      credit_spread_DEU: data_repository/raw/providers/derived_risk_drivers/credit_spread_DEU.csv
    data_provenance:
      EWG: Panel Derived panel merged_panel (German equity ETF stress proxy)
  - key: banking_system
    coverage: BIS LBS aggregates, NPL proxies, Euribor 3m, bank equity indices.
    series_codes:
    - BIS_LBS_Household_Loans_DEU
    - Bank_equity_index_DEU
    - EURIBOR_3m
    local_series_files:
      BIS_LBS_Household_Loans_DEU: data_repository/raw/providers/bis_lbs/monthly/BIS_LBS_Household_Loans_DEU.csv
      NPL_PROXY_DEU: data_repository/raw/providers/npl_proxies/monthly/npl_proxy_DEU.csv
      Bank_equity_index_DEU: data_repository/raw/providers/bank_indices/bank_equity_index_DEU.csv
      EURIBOR_3m: data_repository/raw/providers/derived_risk_drivers/EURIBOR_3m.csv
    data_provenance:
      NPL_PROXY_DEU: BIS LBS household aggregates via scripts/build_npl_proxy_from_bis.py
      Bank_equity_index_DEU: "Equal-weighted composite of Deutsche Bank, Commerzbank, and other DAX banks (scripts/fetch_bank_equity_indexes.py)"
  - key: systemic_stress
    coverage: Swaption-vol proxies, TED, CP spreads.
    series_codes:
    - ECBASSETS
    - SWAPTION_VOL_DEU
    - COMM_PAPER_SPREAD_EUR
    local_series_files:
      BTP_Bund_Spread: data/stress_indicators_expanded.csv
      OAT_Bund_Spread: data/stress_indicators_expanded.csv
      Bonos_Bund_Spread: data/stress_indicators_expanded.csv
      Treasury_Bund_Spread: data/stress_indicators_expanded.csv
      V2X: data_repository/raw/providers/derived_risk_drivers/Euro_STOXX_RealizedVol20.csv
      EURIBOR_ESTR_SPREAD: data/stress_indicators_expanded.csv
      EURIBOR_3m: data_repository/raw/providers/derived_risk_drivers/EURIBOR_3m.csv
      SWAPTION_VOL_DEU: data_repository/raw/providers/derived_risk_drivers/swaption_vol_proxy_DEU.csv
      credit_spread_DEU: data_repository/raw/providers/derived_risk_drivers/credit_spread_DEU.csv
      COMM_PAPER_SPREAD_EUR: data_repository/raw/providers/derived_risk_drivers/comm_paper_spread_EUR.csv
    data_provenance:
      BTP_Bund_Spread: Panel merged stress indicators (BTP vs Bund spread)
      OAT_Bund_Spread: Panel merged stress indicators (OAT vs Bund spread)
      Bonos_Bund_Spread: Panel merged stress indicators (Bonos vs Bund spread)
      Treasury_Bund_Spread: Panel merged stress indicators (Treasury vs Bund spread)
