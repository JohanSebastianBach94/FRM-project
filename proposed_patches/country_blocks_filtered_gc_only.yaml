country_blocks:
  - country: USA
    iso_code: USA
    region: USA
    coverage_window: "1990-2025"
    blocks:
      - key: macro
        coverage: "Core GDP (GDPC1), CPI, unemployment, nominal GDP, BIS credit stocks cover 1990–2025 (monthly/quarterly as noted)."
        status_notes: "Ingested series anchored on FRED/Eurostat/WB feeds ensure continuous macro coverage."
        series_codes:
          - CPIAUCSL
          - UNRATE
        coverage: "CSUSHPISA + BIS mortgage debt + MORTGAGE30US cover 1990–2025."
        status_notes: "Nominal housing/credit proxies ingested; additional rent/income feeds are still being sourced for derived metrics."
        series_codes:
          - CSUSHPISA
          - MORTGAGE30US
        local_series_files:
          BIS_LBS_Household_Loans: data_repository/processed/BIS_LBS_Household_Loans_USA.csv
          BIS_LBS_Private_NFC_Loans: data_repository/processed/BIS_LBS_Private_NFC_Loans_USA.csv
          BIS_LBS_Private_NFC_Total: data_repository/processed/BIS_LBS_Private_NFC_Total_USA.csv
      - key: public_finance
        coverage: "NSS-derived 10y/2y yields and DNSS beta level/slope/curvature factors (reestimated monthly) pair with debt-to-GDP, derived spreads, sovereign short rate + premium to cover 1990–2025."
        status_notes: "Derived spread metadata via SRESS TEST PIPELINE/3.1_clean_panel.py (39 sovereign spread series kept after 0.7 coverage filter); DNSS betas refreshed through `reestimate_dnss_monthly.py` and authored into the stress catalog for encoding."
        series_codes:
          - USA_beta0
          - USA_beta1
          - USA_beta2
        optional_series_codes:
          - GC.DOD.TOTL.GD.ZS_USA
        coverage: "EUR/USD daily coverage 1999–present (Investing + ECB)."
        status_notes: "FX coverage good post-1999; the 1990–1998 expansion is still being completed."
        series_codes:
          - EUR_USD
      - key: financial_markets
        coverage: "Equity indexes, commodity + rate series, BAML corporate yields, derived spreads/volatility/correlations cover 1990–2025 (volatility from Volatility_MeanReversion, spreads from clean panel)."
        status_notes: "Rolling volatility outputs documented under Volatility_MeanReversion/outputs; derived spread notes reference the latest QC."
        series_codes:
          - ^GSPC
          - VIXCLS
          - BAMLH0A0HYM2
          - BAMLC0A4CBBB
          - DCOILBRENTEU
          - DCOILWTICO
      - key: banking_system
        coverage: "BIS LBS loans/deposits plus derived funding stress (short rate spreads) and liquidity stress (volatility proxy) cover 1990–2025."
        status_notes: "Liquidity stress note linked to the HAR/GARCH/FIGARCH fits; coverage highlighted in block catalog."
        series_codes:
          - M2_USA
          - FUNDING_STRESS_USA
          - LIQUIDITY_STRESS_USA
